[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "improc"
version = "1.0.0"
authors = [
    { name="Jacopo Salvalaggio", email="jacopo.salvalaggio@gmail.com" },
]
description = "A simple package to process images."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy==2.5.0",
    "matplotlib==3.11.0"
]

